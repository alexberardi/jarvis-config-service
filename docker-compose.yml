services:
  jarvis-config:
    build: .
    ports:
      - "${JARVIS_CONFIG_PORT:-8013}:${JARVIS_CONFIG_PORT:-8013}"
    env_file: .env
    extra_hosts:
      - "${DOCKER_HOST_ALIAS:-host.docker.internal}:host-gateway"
    volumes:
      - "${JARVIS_HOST_ROOT:-.}:/jarvis"
    restart: unless-stopped

  postgres:
    profiles: ["standalone"]
    image: postgres:15
    environment:
      POSTGRES_DB: jarvis_config
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - config-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  config-pg-data:
